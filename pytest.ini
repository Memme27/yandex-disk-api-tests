[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Корень проекта в sys.path, чтобы работали импорты вида `from src.disk_client import ...`
pythonpath = .

addopts =
    -v
    --strict-markers
    --tb=short
    -ra

markers =
    get: проверки метода GET
    post: проверки метода POST
    put: проверки метода PUT
    delete: проверки метода DELETE
    negative: негативные сценарии — авторизация и валидация параметров
